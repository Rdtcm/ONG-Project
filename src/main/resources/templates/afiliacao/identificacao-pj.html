<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificação PJ - Rede Mais Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Space Grotesk', sans-serif;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5vw 3vw;
            color: #f8fafc;
        }
        .card {
            width: min(900px, 95vw);
            background: rgba(15,23,42,.85);
            border-radius: 32px;
            border: 1px solid rgba(148,163,184,.2);
            padding: clamp(1.5rem, 4vw, 3rem);
            box-shadow: 0 35px 80px rgba(2,6,23,.65);
        }
        h1 { margin-top: 0; }
        label { font-size: .9rem; color: #cbd5f5; }
        input, textarea {
            width: 100%;
            border-radius: 18px;
            border: 1px solid rgba(148,163,184,.3);
            padding: 1rem 1.2rem;
            background: rgba(15,23,42,.6);
            color: inherit;
            margin-bottom: 1rem;
        }
        .grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
        button {
            border: none;
            padding: 1rem;
            border-radius: 999px;
            background: linear-gradient(120deg,#34d399,#22d3ee);
            color: #041320;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: .5rem;
        }
        .erros {
            border: 1px solid rgba(248, 113, 113, .4);
            background: rgba(248, 113, 113, .15);
            border-radius: 20px;
            padding: 1rem;
            color: #fecaca;
            list-style: none;
        }
    </style>
</head>
<body>
<section class="card">
    <h1>Identificação - Pessoa Jurídica</h1>
    <p>Informe os dados essenciais da sua organização.</p>

    <ul class="erros" th:if="${erros}">
        <li th:each="erro : ${erros}" th:text="${erro}"></li>
    </ul>

    <form th:action="@{/afiliacao/identificacao}" method="post">
        <div class="grid">
            <div>
                <label>CNPJ</label>
                <input type="text" th:value="${candidatoEmProcesso.cpfOuCnpj}" readonly>
            </div>
            <div>
                <label>Razão social</label>
                <input type="text" name="razaoSocial" placeholder="Nome legal da organização" required>
            </div>
        </div>

        <div>
            <label>Endereço comercial</label>
            <textarea name="enderecoComercial" rows="3" placeholder="Rua, número, complemento" required></textarea>
        </div>

        <div>
            <label>Representante legal</label>
            <input type="text" name="representanteLegal" placeholder="Nome do responsável" required>
        </div>

        <button type="submit">Anexar certidões</button>
    </form>
</section>
</body>
</html>
