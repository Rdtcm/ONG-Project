<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Email - Rede Mais Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #020617;
            font-family: 'Space Grotesk', sans-serif;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5vw 2vw;
        }
        .card {
            width: min(720px, 95vw);
            text-align: center;
            background: rgba(15,23,42,.85);
            border-radius: 32px;
            border: 1px solid rgba(148,163,184,.2);
            padding: clamp(1.5rem, 4vw, 3rem);
            box-shadow: 0 30px 70px rgba(2,6,23,.65);
        }
        form {
            margin-top: 2rem;
            display: flex;
            gap: .8rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        input {
            border-radius: 16px;
            border: 1px solid rgba(148,163,184,.3);
            background: rgba(15,23,42,.6);
            color: inherit;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            width: min(320px, 80vw);
        }
        button {
            border: none;
            border-radius: 999px;
            padding: 1rem 2rem;
            font-weight: 600;
            background: linear-gradient(120deg,#34d399,#22d3ee);
            color: #02131d;
            cursor: pointer;
        }
        .token {
            margin-top: 1rem;
            font-size: .9rem;
            color: #a5b4fc;
        }
    </style>
</head>
<body>
<section class="card">
    <h1>Valide seu e-mail</h1>
    <p>Enviamos um link seguro para seu endereço. Insira o token abaixo para acelerar o processo.</p>

    <p class="token" th:if="${tokenGerado}">Token gerado (teste): <span th:text="${tokenGerado}">token</span></p>
    <p th:if="${mensagem}" th:text="${mensagem}"></p>

    <form th:action="@{/afiliacao/validar-email}" method="get">
        <input type="text" name="token" placeholder="Cole aqui o token" required>
        <button type="submit">Validar</button>
    </form>
</section>
</body>
</html>
