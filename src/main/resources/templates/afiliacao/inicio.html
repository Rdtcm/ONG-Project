<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Afiliação - Rede Mais Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 15% 20%, rgba(52, 211, 153,.2), transparent 60%),
            radial-gradient(circle at 85% 0%, rgba(59, 130, 246,.3), transparent 45%),
            #020617;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5vw 3vw;
        }
        .grid {
            width: min(1100px, 100%);
            display: grid;
            gap: 2rem;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            align-items: stretch;
        }
        .card {
            background: rgba(15, 23, 42,.9);
            border-radius: 32px;
            padding: clamp(1.8rem, 4vw, 2.8rem);
            border: 1px solid rgba(148, 163, 184, .2);
            box-shadow: 0 25px 80px rgba(2, 6, 23, .65);
        }
        h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-top: 0;
        }
        .selector {
            margin: 2rem 0;
        }
        .selector button {
            border: 1px solid rgba(148, 163, 184, .3);
            border-radius: 26px;
            padding: 1.2rem 1.6rem;
            background: transparent;
            color: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .selector button span {
            display: block;
            font-size: .95rem;
            color: #a5b4fc;
            margin-top: .3rem;
            font-weight: 400;
        }
        label {
            font-size: .9rem;
            color: #cbd5f5;
        }
        input {
            width: 100%;
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, .3);
            background: rgba(15, 23, 42, .6);
            color: #f8fafc;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .submit-btn {
            width: 100%;
            padding: 1.1rem;
            border: none;
            border-radius: 999px;
            background: linear-gradient(120deg,#34d399,#22d3ee);
            font-weight: 600;
            font-size: 1rem;
            color: #051829;
            cursor: pointer;
        }
        .alert {
            background: rgba(248, 113, 113, .15);
            border: 1px solid rgba(248, 113, 113, .5);
            border-radius: 18px;
            padding: 1rem;
            color: #fecaca;
            margin-bottom: 1rem;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(2,6,23,.8);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 10;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            width: min(600px, 90vw);
            background: rgba(15, 23, 42,.95);
            border-radius: 32px;
            border: 1px solid rgba(148,163,184,.25);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 25px 80px rgba(2,6,23,.65);
        }
        .modal-grid {
            margin-top: 2rem;
            display: grid;
            gap: 1.2rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
        .modal-grid button {
            border: 1px solid rgba(148,163,184,.35);
            border-radius: 24px;
            padding: 1.5rem 1rem;
            background: rgba(15, 23, 42, .6);
            color: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease;
        }
        .modal-grid button:hover {
            transform: translateY(-3px);
            border-color: #34d399;
        }
        .modal-close {
            border: none;
            background: transparent;
            color: #cbd5f5;
            margin-top: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="grid">
    <section class="card">
        <p style="letter-spacing:.25em;text-transform:uppercase;color:#94a3b8;">Passo 1</p>
        <h1>Inicie sua solicitação</h1>
        <p>Escolha continuar como Pessoa Física ou Jurídica e informe seus dados de contato para iniciarmos.</p>
        <div class="selector">
            <button type="button" id="openTipoModal">
                Selecionar tipo de pessoa
                <span id="tipoResumo">Pessoa Física selecionada</span>
            </button>
        </div>
    </section>

    <section class="card">
        <form th:action="@{/afiliacao/iniciar}" method="post" id="formInicio">
            <div th:if="${erro}" class="alert" th:text="${erro}"></div>
            <label>E-mail principal</label>
            <input type="email" name="email" placeholder="contato@exemplo.com" required>
            <label>CPF ou CNPJ</label>
            <input type="text" name="cpfOuCnpj" placeholder="Somente números" required>
            <input type="hidden" name="tipoPessoa" id="tipoPessoa" value="PF">
            <small style="color:#94a3b8;display:block;margin-bottom:.5rem;" id="hintTipo">Solicitação iniciada como Pessoa Física.</small>
            <button class="submit-btn" type="submit">Continuar</button>
        </form>
    </section>
</div>

<div class="modal" id="tipoModal">
    <div class="modal-content">
        <h2>Qual o tipo da solicitação?</h2>
        <p>Selecione abaixo a opção que representa melhor o seu perfil.</p>
        <div class="modal-grid">
            <button type="button" data-tipo="PF">Pessoa Física</button>
            <button type="button" data-tipo="PJ">Pessoa Jurídica</button>
        </div>
        <button type="button" class="modal-close" id="closeTipoModal">Cancelar</button>
    </div>
</div>

<script>
    const tipoInput = document.getElementById('tipoPessoa');
    const tipoModal = document.getElementById('tipoModal');
    const openTipoModal = document.getElementById('openTipoModal');
    const closeTipoModal = document.getElementById('closeTipoModal');
    const tipoResumo = document.getElementById('tipoResumo');
    const hintTipo = document.getElementById('hintTipo');

    const atualizarResumo = () => {
        const texto = tipoInput.value === 'PJ' ? 'Pessoa Jurídica selecionada' : 'Pessoa Física selecionada';
        tipoResumo.textContent = texto;
        hintTipo.textContent = tipoInput.value === 'PJ'
            ? 'Solicitação iniciada como Pessoa Jurídica.'
            : 'Solicitação iniciada como Pessoa Física.';
    };

    openTipoModal.addEventListener('click', () => {
        tipoModal.classList.add('active');
    });

    closeTipoModal.addEventListener('click', () => {
        tipoModal.classList.remove('active');
    });

    tipoModal.addEventListener('click', (event) => {
        if (event.target === tipoModal) {
            tipoModal.classList.remove('active');
        }
    });

    tipoModal.querySelectorAll('.modal-grid button').forEach(button => {
        button.addEventListener('click', () => {
            tipoInput.value = button.dataset.tipo;
            atualizarResumo();
            tipoModal.classList.remove('active');
        });
    });

    atualizarResumo();
</script>
</body>
</html>
