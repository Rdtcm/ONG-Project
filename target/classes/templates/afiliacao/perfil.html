<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Rede Mais Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #020617;
            font-family: 'Space Grotesk', sans-serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4vw 2vw;
        }
        .card {
            width: min(880px, 95vw);
            background: rgba(15,23,42,.85);
            border-radius: 32px;
            border: 1px solid rgba(148,163,184,.2);
            padding: clamp(1.5rem,4vw,3rem);
            box-shadow: 0 30px 70px rgba(2,6,23,.65);
        }
        h1 { margin-top: 0; }
        textarea, select, input {
            width: 100%;
            border-radius: 18px;
            border: 1px solid rgba(148,163,184,.3);
            background: rgba(15,23,42,.6);
            color: inherit;
            padding: 1rem;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        button {
            border: none;
            border-radius: 999px;
            padding: 1rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            background: linear-gradient(120deg,#34d399,#22d3ee);
            color: #02131d;
        }
        .erros {
            border: 1px solid rgba(248, 113, 113, .4);
            background: rgba(248, 113, 113, .15);
            border-radius: 20px;
            padding: 1rem;
            color: #fecaca;
            list-style: none;
        }
    </style>
</head>
<body>
<section class="card">
    <h1>Monte seu perfil</h1>
    <p>Conte-nos sobre suas habilidades e interesses para conectá-lo a oportunidades personalizadas.</p>

    <ul class="erros" th:if="${erros}">
        <li th:each="erro : ${erros}" th:text="${erro}"></li>
    </ul>

    <form th:action="@{/afiliacao/perfil}" method="post">
        <label>Habilidades (separe por vírgula)</label>
        <textarea name="habilidades" rows="3" placeholder="Gestão de projetos, Captação de recursos..." required></textarea>

        <label>Interesses (separe por vírgula)</label>
        <textarea name="interesses" rows="3" placeholder="Juventude, Tecnologia social..." required></textarea>

        <label>Tipo de perfil</label>
        <select name="tipoPerfil" required>
            <option value="">Escolha uma opção</option>
            <option value="MENTOR">Mentor</option>
            <option value="VOLUNTARIO">Voluntário</option>
            <option value="PARCEIRO">Parceiro</option>
        </select>

        <button type="submit">Visualizar termo</button>
    </form>
</section>
</body>
</html>
