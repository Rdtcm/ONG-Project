<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status da Solicitação - Rede Mais Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 15% 20%, rgba(56,189,248,.2), transparent 60%),
            radial-gradient(circle at 85% 0%, rgba(34,197,94,.2), transparent 45%),
            #020617;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4vw 3vw;
        }
        .card {
            width: min(720px, 95vw);
            background: rgba(7, 15, 31, .9);
            border-radius: 32px;
            border: 1px solid rgba(148, 163, 184, .25);
            padding: clamp(1.5rem, 4vw, 3rem);
            box-shadow: 0 35px 80px rgba(2,6,23,.65);
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: clamp(2rem, 4vw, 2.8rem);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .6rem 1.5rem;
            border-radius: 999px;
            background: rgba(59, 130, 246, .15);
            border: 1px solid rgba(59, 130, 246, .4);
            color: #bfdbfe;
            font-weight: 600;
            margin: 1rem 0;
        }
        .details {
            margin: 1.5rem 0;
            padding: 1.5rem;
            border-radius: 24px;
            background: rgba(15, 23, 42, .65);
            border: 1px solid rgba(148,163,184,.25);
            text-align: left;
        }
        .details p {
            margin: .4rem 0;
            color: #cbd5f5;
        }
        a.button {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2rem;
            border-radius: 999px;
            background: linear-gradient(120deg,#34d399,#22d3ee);
            color: #021423;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 25px 45px rgba(34, 211, 238, .25);
        }
    </style>
</head>
<body>
<section class="card">
    <p style="letter-spacing:.3em;color:#94a3b8;text-transform:uppercase;">Status da solicitação</p>
    <h1>Sua validação foi recebida!</h1>

    <div class="status-pill">
        <span>🕒</span>
        <span th:text="${status} ?: 'AGUARDANDO_APROVACAO'">AGUARDANDO_APROVACAO</span>
    </div>

    <p>Obrigada por validar seu e-mail. Agora sua solicitação está aguardando análise da Rede Mais Social.</p>

    <div class="details" th:if="${candidato}">
        <p><strong>Nome:</strong> <span th:text="${candidato.nome}">Nome do candidato</span></p>
        <p><strong>E-mail:</strong> <span th:text="${candidato.email}">email@dominio.com</span></p>
        <p><strong>Data da solicitação:</strong>
            <span th:text="${#temporals.format(candidato.dataSolicitacao, 'dd/MM/yyyy HH:mm')}">00/00/0000</span>
        </p>
    </div>

    <a class="button" th:href="@{/}">Voltar para a página inicial</a>
</section>
</body>
</html>
