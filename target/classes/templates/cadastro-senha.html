<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar senha - Rede Mais Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(56, 189, 248,.35), transparent 50%),
            radial-gradient(circle at 90% 10%, rgba(34, 197, 94,.35), transparent 45%),
            #020617;
            color: #e2e8f0;
        }

        .wrapper {
            width: min(640px, 92vw);
            background: rgba(15, 23, 42, .8);
            border: 1px solid rgba(148, 163, 184, .2);
            border-radius: 28px;
            padding: clamp(1.5rem, 4vw, 3rem);
            box-shadow: 0 30px 60px rgba(2, 6, 23, .65);
        }

        h1 { margin-top: 0; font-size: clamp(2rem, 4vw, 2.8rem); }
        p { color: #cbd5f5; }

        form {
            display: grid;
            gap: 1rem;
            margin-top: 2rem;
        }

        label {
            font-size: .95rem;
            color: #cbd5f5;
        }

        input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, .35);
            background: rgba(15, 23, 42, .6);
            color: #f8fafc;
            font-size: 1rem;
        }

        button {
            margin-top: 1rem;
            border: none;
            padding: 1rem;
            border-radius: 999px;
            background: linear-gradient(120deg,#34d399,#22d3ee);
            color: #02131d;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(34, 211, 238, .35);
        }
    </style>
</head>
<body>
<section class="wrapper">
    <h1>Proteja sua conta</h1>
    <p>Defina uma senha forte para acessar recursos exclusivos da Rede Mais Social.</p>

    <div th:if="${errosCadastro}" style="border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.15);border-radius:16px;padding:1rem;color:#fecaca;">
        <p style="margin-top:0;font-weight:600;">Não foi possível salvar:</p>
        <ul style="padding-left:1.2rem;margin:0;">
            <li th:each="erro : ${errosCadastro}" th:text="${erro}"></li>
        </ul>
    </div>

    <form th:action="@{/cadastro-senha}" method="post">
        <div>
            <label for="email">E-mail corporativo</label>
            <input id="email" name="email" type="email" placeholder="nome@organizacao.org"
                   th:value="${emailPrefill}">
        </div>
        <div>
            <label for="senha">Nova senha</label>
            <input id="senha" name="senha" type="password" placeholder="Mínimo 6 caracteres">
        </div>
        <div>
            <label for="confirmacao">Confirmar senha</label>
            <input id="confirmacao" name="confirmacao" type="password" placeholder="Repita a nova senha">
        </div>
        <button type="submit">Salvar e acessar</button>
    </form>
</section>
</body>
</html>
